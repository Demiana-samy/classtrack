name: Demo screenshots
on:
  push:
    branches: [chore/demo-screenshots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
      - run: flutter pub get
      - run: flutter test tool/demo/flow_test.dart
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f tool/demo/flow/*
          git commit -m "chore: demo screenshots [skip ci]" || echo "nothing to commit"
          git push
