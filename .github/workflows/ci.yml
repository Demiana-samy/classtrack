name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.47+ deprecates `package:flutter/material.dart`,
          # which makes `flutter analyze` fail on every file. Bump together
          # with the material_ui migration.
          flutter-version: 3.44.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Firestore rules tests (emulator)
        working-directory: firebase_tests
        run: |
          npm install --no-audit --no-fund
          npm test
